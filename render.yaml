# render.yaml — Render.com deployment configuration for Xpense Backend
# Docs: https://render.com/docs/yaml-spec
#
# IMPORTANT: After pushing this file, go to Render Dashboard → your service →
# Settings → and verify "Root Directory" is set to "backend"
# If Render doesn't pick up render.yaml automatically, manually set:
#   Root Directory : backend
#   Build Command  : npm install && npm run build
#   Start Command  : npm start

services:
  - type: web
    name: xpense-backend
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node --dns-result-order=ipv4first dist/index.js
    plan: free

    envVars:
      - key: NODE_VERSION
        value: "20.19.4"
      - key: NODE_ENV
        value: production

      # ── Add ALL secrets manually in Render Dashboard → Environment ────────────
      # Do NOT put real values here — this file is committed to git.
      #
      # Required environment variables to set in Render dashboard:
      #
      #   MONGO_URI              mongodb+srv://user:pass@cluster.mongodb.net/xpense...
      #   MONGO_PASSWORD         <your atlas password>
      #   JWT_SECRET             <strong random secret, min 32 chars>
      #   EMAIL_USER             rishabh.verma2626@gmail.com
      #   EMAIL_PASS             <16-char gmail app password, no spaces>
      #   RESEND_API_KEY         re_xxxxxxxxxxxxxxxxx  (get free at resend.com)
      #   CLOUDINARY_CLOUD_NAME  xpense
      #   CLOUDINARY_API_KEY     <your key>
      #   CLOUDINARY_API_SECRET  <your secret>
      #   FIREBASE_PROJECT_ID    xpense-23d5f
      #   FIREBASE_CLIENT_EMAIL  <service account email>
      #   FIREBASE_PRIVATE_KEY   -----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----
      #   ALLOWED_ORIGINS        https://xpense-blush.vercel.app
